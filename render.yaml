databases:
  - name: geowork-db
    plan: free
    databaseName: geowork
    user: geowork

services:
  - type: web
    name: geowork-backend
    runtime: docker
    plan: free
    healthCheckPath: /admin/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geowork-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_SUPERUSER_PHONE
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
